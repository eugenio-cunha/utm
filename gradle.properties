# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Argumentos de JVM do daemon do Gradle. Além do heap (-Xmx/-Xms), as flags abaixo ajustam o
# coletor de lixo para o padrão de um build Android/Kotlin (muitas classes carregadas e
# recompiladas por incremental build):
# - UseG1GC: coletor de baixa pausa, melhor para builds interativos que rodam por minutos.
# - SoftRefLRUPolicyMSPerMB=1: por padrão a JVM só libera SoftReferences ~1000ms por MB de heap
#   livre (≈51min com 4g de heap) — reduzir para 1ms/MB faz o Gradle liberar cache de compilação
#   ocioso em segundos em vez de só no fim do build.
# - ReservedCodeCacheSize=256m: aumenta o espaço reservado para código JIT compilado (o padrão da
#   plataforma, 32-48m, é pequeno demais para a quantidade de classes carregadas num build Android).
# - HeapDumpOnOutOfMemoryError: gera um heap dump automático se o daemon estourar memória,
#   facilitando diagnosticar a causa depois.
# O heap (3g) é dimensionado para os 4 módulos atuais do gnss; ajuste conforme o projeto clonado
# a partir deste template crescer (o NowInAndroid, bem maior, usa 4g).
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=1 -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Xmx3g -Xms3g

# O daemon do compilador Kotlin roda como um processo separado do daemon do Gradle e só herda
# Xmx/ReservedCodeCacheSize/MaxMetaspaceSize das flags acima — as demais (GC, SoftRefLRUPolicy,
# heap dump) precisam ser repetidas aqui para o daemon Kotlin (responsável por compilar todo o
# código dos 4 módulos) se beneficiar do mesmo tuning.
kotlin.daemon.jvmargs=-Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=1 -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Xmx3g -Xms3g

# Executa tasks de projetos/módulos diferentes em paralelo quando não há dependência entre eles.
# No gnss, :data e :presentation não dependem um do outro (ambos só dependem de :domain), então
# compilação/testes desses dois podem rodar ao mesmo tempo.
org.gradle.parallel=true

# Cache de build entre execuções: outputs de tasks (compilação, testes, etc.) já produzidos antes
# (localmente ou, se configurado, num cache remoto compartilhado pelo time/CI) são reaproveitados
# em vez de reexecutados, desde que as entradas não tenham mudado.
org.gradle.caching=true

# Quando habilitado, o Configuration Cache permite ao Gradle pular a fase de configuração inteira
# se nada que a afeta (scripts de build, gradle.properties, etc.) mudou desde a última execução —
# isso inclui a configuração das tasks graphDump/graphUpdate do RootPlugin.
org.gradle.configuration-cache=true
# Permite que a fase de configuração (quando o cache acima precisa ser recalculado) também rode as
# tasks de configuração dos módulos em paralelo, complementando org.gradle.parallel acima.
org.gradle.configuration-cache.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Desabilita features de build que a AGP habilita por padrão mas que nenhum módulo do gnss usa
# hoje (resValues em XML e shaders) — evita gerar infraestrutura de build para algo não utilizado.
# https://developer.android.com/build/releases/gradle-plugin#default-changes
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

# Mantém o app instalado no dispositivo/emulador entre execuções de teste instrumentado (ex.:
# HomeScreenTest, em :presentation) em vez de desinstalar e reinstalar a cada rodada — acelera
# bastante reexecuções locais de androidTest.
# https://issuetracker.google.com/issues/295039976
android.injected.androidTest.leaveApksInstalledAfterRun=true

# Habilita o modo de isolamento de projeto do KSP (usado por Room em :data e Hilt em todos os
# módulos Android), tornando seu processamento compatível com o Isolated Projects do Gradle — o
# RootPlugin.kt deste projeto já verifica BuildFeatures.isolatedProjects.active para decidir se
# registra as tasks graphDump/graphUpdate, então esta flag mantém o KSP alinhado com essa mesma
# premissa de isolamento.
ksp.project.isolation.enabled=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
